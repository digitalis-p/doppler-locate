[project]
name = "dopploc"
version = "0.1.0"
description = "Geolocate audio recordings from propeller-aircraft Doppler curves matched to ADS-B tracks"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.12",
  "numba>=0.60",
  "polars>=1.0",
  "pyarrow>=15",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "matplotlib>=3.8",
  "soundfile>=0.12",
  "requests>=2.31",
  "tqdm>=4.66",
  "eccodes>=2.37",
  "tomlkit>=0.12",
]

[project.urls]
Repository = "https://github.com/digitalis-p/doppler-locate"

[project.optional-dependencies]
test = ["pytest>=8"]
# GTK app; also needs the system GTK 4, libadwaita and (for the map) libshumate typelibs
gui = ["pygobject>=3.50", "pycairo>=1.26"]

[project.scripts]
dopploc = "dopploc.cli:main"
dopploc-gui = "dopploc.gui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dopploc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
