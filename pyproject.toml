[project]
name = "dopploc"
version = "0.1.0"
description = "Geolocate audio recordings from propeller-aircraft Doppler curves matched to ADS-B tracks"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.12",
  "numba>=0.60",
  "polars>=1.0",
  "pyarrow>=15",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "matplotlib>=3.8",
  "soundfile>=0.12",
  "requests>=2.31",
  "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
dopploc = "dopploc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dopploc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
